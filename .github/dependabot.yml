# Weekly pull requests for minor and patch updates, grouped into one per
# ecosystem so there is little to review. Major versions are ignored: they
# change behaviour (Next 16.4 changed the build output under our CSP) and are
# taken deliberately, not from a bot. Security fixes still arrive as soon as
# GitHub knows of them. Vercel does not build these branches (vercel.json).
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Kept within 1.x on purpose (requirements.txt).
      - dependency-name: "anthropic"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
